name: T3 v2 native amd64 validation
on:
  workflow_dispatch:
    inputs:
      image:
        description: Approved public image pinned by repository@sha256 digest
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Unpack frozen QA source files
        run: unzip -q t3-v2-native-qa.zip
      - name: Verify frozen QA bundle
        run: python t3-v2/native_validate.py --check-bundle
      - name: Validate same approved image on native amd64
        env:
          T3_IMAGE: ${{ inputs.image }}
        run: python -u t3-v2/native_validate.py
      - name: Retain local-developer validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t3-v2-native-evidence
          if-no-files-found: warn
          path: |
            t3-v2/native-validation.json
            t3-v2/runtime-probe.json
            t3-v2/native-resources.json
            t3-v2/reports/
            outputs/final_development/**/summary.json
            outputs/final_development/**/validation.json
            outputs/final_development/**/run.log
            outputs/final_development/**/protocol.json
            outputs/final_development/**/command.json
            outputs/final_development/**/container-state.json
            outputs/final_development/**/completion.json
